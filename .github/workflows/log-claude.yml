name: log-claude

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run Claude even if 5 hours haven't elapsed"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  say-hi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check elapsed time since last run
        id: gate
        run: |
          STATE_FILE=".github/state/last-claude-run"
          NOW=$(date +%s)
          LAST=$(cat "$STATE_FILE" 2>/dev/null || echo 0)
          ELAPSED=$(( NOW - LAST ))
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          if [ "$ELAPSED" -ge 18000 ] || [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.should_run == 'true'
        with:
          prompt: "hi"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Record run timestamp
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p .github/state
          echo "${{ steps.gate.outputs.now }}" > .github/state/last-claude-run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add .github/state/last-claude-run
          git diff --cached --quiet || git commit -m "chore: record last Claude run timestamp"
          git push

name: log-claude

on:
  schedule:
    - cron: "29 2,7,12,17,22 * * *"
  workflow_dispatch: {}

jobs:
  say-hi:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "hi"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
